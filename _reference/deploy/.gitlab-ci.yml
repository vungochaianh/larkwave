# deploy/.gitlab-ci.yml — template cho repo của MỖI app sinh ra.
# Secret KHÔNG để ở đây. Đặt trong GitLab > Settings > CI/CD > Variables (Masked + Protected):
#   CF_API_TOKEN, CF_ACCOUNT_ID, DOMAIN_GOC
stages: [build, deploy]

build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build
  artifacts:
    paths: [dist/]      # đổi thành .next/ hoặc out/ tuỳ framework
    expire_in: 1 hour

deploy_preview:
  stage: deploy
  image: node:20
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'   # nhánh phụ -> preview
  script:
    - npm i -g wrangler
    - wrangler pages deploy dist --project-name="$CI_PROJECT_NAME" --branch="$CI_COMMIT_BRANCH"
  environment:
    name: preview/$CI_COMMIT_REF_SLUG

deploy_production:
  stage: deploy
  image: node:20
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'   # main -> subdomain chính thức
  script:
    - npm i -g wrangler
    - wrangler pages deploy dist --project-name="$CI_PROJECT_NAME" --branch=main
    # gắn custom subdomain {project}.{DOMAIN_GOC} qua Cloudflare API
    - |
      curl -s -X POST \
        "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CI_PROJECT_NAME/domains" \
        -H "Authorization: Bearer $CF_API_TOKEN" \
        -H "Content-Type: application/json" \
        --data "{\"name\":\"$CI_PROJECT_NAME.$DOMAIN_GOC\"}"
  environment:
    name: production
    url: https://$CI_PROJECT_NAME.$DOMAIN_GOC
