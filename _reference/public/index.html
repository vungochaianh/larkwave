<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolswave · App Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#11141B; --panel:#191D27; --panel2:#1F2430; --line:#2A3140;
    --text:#E6E9F0; --muted:#8B93A6; --amber:#F2A23C; --teal:#3FB8A0; --red:#E5634D;
    --r:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);
    font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.5}
  code,.mono{font-family:"JetBrains Mono",monospace}
  header{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
  header h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.5px}
  header .tag{font-family:"JetBrains Mono";font-size:11px;color:var(--muted);
    border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  nav{margin-left:auto;display:flex;gap:4px}
  nav button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;
    padding:8px 14px;border-radius:8px;cursor:pointer}
  nav button.active{background:var(--panel2);color:var(--text)}
  main{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
  .view{display:none} .view.active{display:block}
  textarea,input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:var(--r);padding:13px 14px;font-family:inherit;font-size:15px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--amber)}
  .row{display:flex;gap:12px;align-items:center;margin-top:12px}
  .btn{background:var(--amber);color:#1a1205;border:none;font-family:inherit;font-weight:700;
    padding:12px 22px;border-radius:var(--r);cursor:pointer;font-size:15px}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
  label{display:block;font-size:12px;color:var(--muted);margin:18px 0 6px;letter-spacing:.4px;text-transform:uppercase}
  /* pipeline rail — signature */
  .rail{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:26px 0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;position:relative;overflow:hidden}
  .stage .n{font-family:"JetBrains Mono";font-size:11px;color:var(--muted)}
  .stage .nm{font-size:13px;margin-top:6px;font-weight:500}
  .stage .s{font-size:11px;margin-top:8px;color:var(--muted);font-family:"JetBrains Mono"}
  .stage.running{border-color:var(--amber)} .stage.running .s{color:var(--amber)}
  .stage.running::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(242,162,60,.12),transparent);animation:sweep 1.3s linear infinite}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .stage.done{border-color:var(--teal)} .stage.done .s{color:var(--teal)}
  .stage.error{border-color:var(--red)} .stage.error .s{color:var(--red)}
  .console{background:#0C0F15;border:1px solid var(--line);border-radius:var(--r);padding:16px;
    font-family:"JetBrains Mono";font-size:13px;white-space:pre-wrap;color:#C8CEDC;min-height:120px;margin-top:18px}
  .result{background:var(--panel2);border:1px solid var(--teal);border-radius:var(--r);padding:16px;margin-top:16px}
  .result a{color:var(--teal)}
  .joblist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .jobcard{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:12px 14px;cursor:pointer}
  .jobcard:hover{border-color:var(--muted)}
  .pill{font-family:"JetBrains Mono";font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .pill.done{color:var(--teal);border-color:var(--teal)} .pill.running{color:var(--amber);border-color:var(--amber)}
  .pill.error{color:var(--red);border-color:var(--red)}
  .muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted);margin-top:6px}
  pre.cfg{background:#0C0F15;border:1px solid var(--line);border-radius:var(--r);padding:16px;
    font-family:"JetBrains Mono";font-size:13px;min-height:300px;white-space:pre;overflow:auto;color:#C8CEDC}
  .saved{color:var(--teal);font-size:13px;margin-left:10px}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>TOOLSWAVE · APP BUILDER</h1>
  <span class="tag">orchestrator v0.1</span>
  <nav>
    <button class="active" data-v="build">Tạo app</button>
    <button data-v="jobs">Lịch sử</button>
    <button data-v="config">Cấu hình</button>
  </nav>
</header>
<main>
  <!-- BUILD -->
  <section class="view active" id="v-build">
    <label>Mô tả app bạn muốn</label>
    <textarea id="prompt" rows="4" placeholder="VD: Làm web tính lãi suất vay theo tháng, có biểu đồ, deploy luôn"></textarea>
    <label>Tên app (tuỳ chọn)</label>
    <input id="name" placeholder="để trống sẽ tự đặt từ mô tả">
    <div class="row">
      <button class="btn" id="go">Tạo app</button>
      <span class="hint" id="status"></span>
    </div>

    <div class="rail" id="rail"></div>
    <div class="console" id="console">Nhập mô tả rồi bấm “Tạo app”. Pipeline 6 giai đoạn sẽ chạy ở đây.</div>
    <div id="result"></div>
  </section>

  <!-- JOBS -->
  <section class="view" id="v-jobs">
    <label>Các app đã tạo</label>
    <div class="joblist" id="joblist"></div>
  </section>

  <!-- CONFIG -->
  <section class="view" id="v-config">
    <label>Cấu hình pipeline (tracks, prompt mẫu, giới hạn) — sửa rồi lưu</label>
    <p class="hint">Đây là các phần bạn “sửa lại sau”: từ khoá nhận diện track, stack mặc định, mẫu prompt cho từng bước, quy tắc subdomain, giới hạn chi phí.</p>
    <pre class="cfg" id="cfg" contenteditable="true"></pre>
    <div class="row">
      <button class="btn" id="saveCfg">Lưu cấu hình</button>
      <button class="btn ghost" id="reloadCfg">Tải lại</button>
      <span class="saved" id="cfgMsg"></span>
    </div>
  </section>
</main>
<script>
const STAGES=[["intake","Phân loại"],["spec","Spec"],["code","Sinh code"],["build","Build"],["preview","Preview"],["deploy","Deploy"]];
const $=s=>document.querySelector(s);
let pass=localStorage.getItem("cmspass")||"";
const headers=()=>({ "content-type":"application/json", ...(pass?{"x-cms-pass":pass}:{}) });

// nav
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#v-"+b.dataset.v).classList.add("active");
  if(b.dataset.v==="jobs")loadJobs();
  if(b.dataset.v==="config")loadCfg();
});

function renderRail(stages={}){
  $("#rail").innerHTML=STAGES.map(([k,nm],i)=>{
    const st=(stages[k]&&stages[k].status)||"";
    return `<div class="stage ${st}"><div class="n">${i+1}/6</div><div class="nm">${nm}</div><div class="s">${st||"chờ"}</div></div>`;
  }).join("");
}
renderRail();

$("#go").onclick=async()=>{
  const prompt=$("#prompt").value.trim(); if(!prompt)return;
  $("#go").disabled=true; $("#status").textContent="đang khởi tạo…"; $("#result").innerHTML="";
  $("#console").textContent="";
  try{
    const r=await fetch("/api/build",{method:"POST",headers:headers(),
      body:JSON.stringify({prompt,name:$("#name").value.trim()})});
    const {id,error}=await r.json();
    if(error){throw new Error(error)}
    poll(id);
  }catch(e){$("#status").textContent="Lỗi: "+e.message; $("#go").disabled=false;}
};

async function poll(id){
  const r=await fetch("/api/jobs/"+id,{headers:headers()});
  const job=await r.json();
  renderRail(job.stages);
  $("#console").textContent=(job.log||[]).join("\n");
  if(job.spec)$("#console").textContent+="\n\n— SPEC —\n"+job.spec;
  if(job.status==="done"||job.status==="error"){
    $("#go").disabled=false; $("#status").textContent=job.status==="done"?"Hoàn tất":"Dừng do lỗi";
    const dep=job.stages.deploy&&job.stages.deploy.output;
    if(dep)$("#result").innerHTML=`<div class="result"><b>Kết quả</b><br>${dep.url?`<a href="${dep.url}" target="_blank">${dep.url}</a>`:""}<br><span class="muted">${dep.status||dep.note||""}</span></div>`;
    return;
  }
  setTimeout(()=>poll(id),1200);
}

async function loadJobs(){
  const jobs=await (await fetch("/api/jobs",{headers:headers()})).json();
  $("#joblist").innerHTML=jobs.length?jobs.map(j=>
    `<div class="jobcard" onclick="openJob('${j.id}')">
      <span class="pill ${j.status}">${j.status}</span>
      <b>${j.name||j.slug||j.id}</b>
      <span class="muted" style="margin-left:auto;font-size:13px">${j.prompt.slice(0,60)}</span>
    </div>`).join(""):`<p class="muted">Chưa có app nào.</p>`;
}
window.openJob=id=>{document.querySelector('nav button[data-v="build"]').click();poll(id);};

async function loadCfg(){
  const c=await (await fetch("/api/config",{headers:headers()})).json();
  $("#cfg").textContent=JSON.stringify(c,null,2);
}
$("#reloadCfg").onclick=loadCfg;
$("#saveCfg").onclick=async()=>{
  try{
    const body=JSON.parse($("#cfg").textContent);
    await fetch("/api/config",{method:"PUT",headers:headers(),body:JSON.stringify(body)});
    $("#cfgMsg").textContent="Đã lưu ✔"; setTimeout(()=>$("#cfgMsg").textContent="",2000);
  }catch(e){$("#cfgMsg").textContent="JSON lỗi: "+e.message;}
};
</script>
</body>
</html>
