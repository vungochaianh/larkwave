# Template — copy to ../docker-compose.yml (project root), rename services to your
# folders, and use a FREE host-port block (left of "ports", must match ROUTES in
# deploy.config.sh). Backends read secrets from their own .env (rsynced, not committed).
services:
  web:
    build: ./web                       # a Next.js / Vite / static frontend
    restart: always
    ports: ["9200:3000"]               # host:container
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://apimyapp.toolswave.net  # browser → backend
    networks: [appnet]

  api:
    build: ./api                       # Node / NestJS / FastAPI backend
    restart: always
    ports: ["9201:3001"]
    env_file: ["./api/.env"]           # DB url, secrets… (NOT committed)
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks: [appnet]

  # Optional database (internal-only; no public port needed).
  db:
    image: postgres:16                 # or mongo:7, mysql:8…
    restart: always
    environment:
      - POSTGRES_PASSWORD=change-me
    volumes: ["db-data:/var/lib/postgresql/data"]
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  db-data:
