# Dedicated cloudflared tunnel for generated apps: *.a.toolswave.net.
# Install to /etc/cloudflared-apps/config.yml and run as a SEPARATE systemd
# service so it never disturbs the shared `toolswave` tunnel.
tunnel: e07c9eb7-1fca-454b-a8b7-9e461dfc36e0
credentials-file: /home/deveris/.cloudflared/e07c9eb7-1fca-454b-a8b7-9e461dfc36e0.json
ingress:
  # Only hostnames whose DNS CNAME points at THIS tunnel reach here (the per-app
  # <slug>.toolswave.net records the API creates). Platform records (app/aapp/apia)
  # point at the shared tunnel and never arrive here.
  - hostname: "*.toolswave.net"
    service: http://localhost:8095
  - service: http_status:404
