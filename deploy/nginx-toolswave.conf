# Toolswave zero-downtime front proxy — install to /etc/nginx/conf.d/toolswave.conf
#
# cloudflared points app/aapp.toolswave.net -> 127.0.0.1:4090 (this web front) and
# apia.toolswave.net -> 127.0.0.1:4091 (this api front). nginx load-balances the WEB
# across two instances (4100 + 4102) so a rolling restart never drops the site.
# The API is a single instance (in-process cron schedulers must not double-fire), so
# 4091 just fronts 4101 — kept here so streaming (SSE) settings live in one place.
#
# SSE is used everywhere (chat / relay / notifications) → proxy_buffering off
# + long read timeouts + HTTP/1.1 are REQUIRED or streams break.

map $http_upgrade $tw_conn_upgrade { default upgrade; '' close; }

# ── Security / abuse control ────────────────────────────────────────────────
# Don't advertise the nginx version on responses and error pages.
server_tokens off;

# REAL CLIENT IP. cloudflared connects over loopback, so $remote_addr is 127.0.0.1 for
# every request on earth — a rate limit keyed on it would put the whole internet in ONE
# bucket. Cloudflare SETS and OVERWRITES CF-Connecting-IP, so it cannot be forged by a
# client coming through the tunnel; X-Forwarded-For is NOT usable here because the client
# controls its left-most entry. Only trust the loopback hop as the source of that header.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Rate-limit buckets, keyed on the real client IP recovered above.
#   tw_auth   — login/register/forgot/reset: credential stuffing is the threat, and a human
#               never needs more than a handful of attempts a minute.
#   tw_public — the unauthenticated read endpoints a scraper would walk to dump the
#               catalogue (public apps, blog, share links). Generous for a human browsing,
#               ruinous for someone paging through 500 items at a time.
#   tw_all    — a backstop so no single IP can flood the box.
# 10m of shared memory holds ~160k IPs per zone.
limit_req_zone $binary_remote_addr zone=tw_auth:10m   rate=12r/m;
limit_req_zone $binary_remote_addr zone=tw_public:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=tw_all:10m    rate=600r/m;
limit_conn_zone $binary_remote_addr zone=tw_conn:10m;
# 429 (not the default 503) so clients and Cloudflare see a real "slow down".
limit_req_status 429;
limit_conn_status 429;

upstream tw_web {
    server 127.0.0.1:4100 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:4102 max_fails=1 fail_timeout=2s;
}
upstream tw_api {
    server 127.0.0.1:4101 max_fails=1 fail_timeout=2s;
}

server {
    listen 127.0.0.1:4090;
    server_name _;
    client_max_body_size 64m;

    # Defense-in-depth: the Next.js app sets these too (apps/web/next.config.ts), but these
    # also cover error pages and anything nginx answers itself. `always` = include them on
    # 4xx/5xx as well. NOTE: add_header in a nested block DISCARDS every inherited
    # add_header, so if you ever add one inside `location`, repeat these there too.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # 30 concurrent connections per IP: a browser opens ~6 per origin plus SSE streams
        # across a few tabs, so this only bites a scraper opening dozens in parallel.
        limit_conn tw_conn 30;
        limit_req zone=tw_all burst=200 nodelay;
        proxy_pass http://tw_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tw_conn_upgrade;
        # Route GET/idempotent requests around an instance that is mid-restart.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 127.0.0.1:4091;
    server_name _;
    # 64m, down from 256m: the app itself rejects a JSON body over 16m (apps/api/src/main.ts),
    # so nginx used to stream up to a quarter-gigabyte into Node just to have it refused.
    # Kept above 16m because multipart uploads (avatars, attachments) are capped per-route.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Credential stuffing / password spraying. burst=5 absorbs a fat-fingered retry;
    # sustained attempts queue and then 429. The app ALSO locks out after 8 wrong
    # passwords per email + per IP (apps/api/src/auth/auth.service.ts) — this is the
    # cheaper outer layer that never reaches Node.
    # nginx locations don't inherit a sibling's directives, so the proxy block is repeated
    # in each. Keep the three copies in this server block identical apart from the limits.
    location ~ ^/v1/auth/(login|register|forgot|reset) {
        limit_req zone=tw_auth burst=5 nodelay;
        proxy_pass http://tw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tw_conn_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;   # SSE streams
        proxy_send_timeout 3600s;
        proxy_buffering off;         # SSE — must not buffer
        proxy_request_buffering off;
    }

    # The unauthenticated read surface a scraper would walk.
    location ~ ^/v1/(public|blog|pub)/ {
        limit_req zone=tw_public burst=60 nodelay;
        proxy_pass http://tw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tw_conn_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;   # SSE streams
        proxy_send_timeout 3600s;
        proxy_buffering off;         # SSE — must not buffer
        proxy_request_buffering off;
    }

    location / {
        limit_conn tw_conn 30;
        limit_req zone=tw_all burst=200 nodelay;
        proxy_pass http://tw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tw_conn_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;   # SSE streams
        proxy_send_timeout 3600s;
        proxy_buffering off;         # SSE — must not buffer
        proxy_request_buffering off;
    }
}
